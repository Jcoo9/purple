<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-GGXNH132QJ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-GGXNH132QJ');
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Purple Poll Widget</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#141210;--paper:#f7f4ef;--yes:#1565c0;--no:#c62828;
  --rule:#d4cdc2;--surface:#eeeae3;--ink3:#7a736a;--ink4:#9a948c;
  --cond:#7b3fa0;
  font-family:'Georgia','Source Serif 4',serif;
}
body{background:var(--paper);color:var(--ink);min-height:100%;overflow-x:hidden}

.widget{border:2px solid var(--ink);max-width:600px;margin:0 auto;background:var(--paper)}
.widget-head{padding:10px 14px;border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between}
.widget-brand{display:flex;align-items:center;gap:6px}
.widget-brand-logo{font-family:serif;font-size:18px;font-weight:900;color:var(--ink)}
.widget-brand-tag{font-family:monospace;font-size:7px;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink3)}
.widget-pulse{font-family:monospace;font-size:7px;letter-spacing:0.08em;text-transform:uppercase;color:var(--yes);display:flex;align-items:center;gap:4px}
.pulse-dot{width:5px;height:5px;border-radius:50%;background:var(--yes);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

.widget-q{padding:14px 16px;font-size:17px;font-weight:900;line-height:1.3;color:var(--ink);border-bottom:1px solid var(--rule)}
.widget-tag{font-family:monospace;font-size:7px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px}

.widget-sides{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--rule);background:var(--ink)}
.widget-side{padding:8px 10px;cursor:pointer;transition:opacity 0.2s}
.widget-side:hover{opacity:0.85}
.widget-side-lbl{font-family:monospace;font-size:7px;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:4px}
.widget-side-txt{font-family:Georgia,serif;font-size:11px;font-style:italic;color:rgba(255,255,255,0.7);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.widget-side-divider{width:1px;background:rgba(255,255,255,0.15)}

.widget-votes{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--rule)}
.widget-vote-btn{padding:16px 8px;cursor:pointer;background:var(--paper);border:none;transition:background 0.15s;display:flex;flex-direction:column;align-items:center;gap:4px}
.widget-vote-btn:hover{background:var(--surface)}
.widget-vote-btn:active{transform:scale(0.97)}
.widget-vote-lbl{font-family:Georgia,serif;font-size:24px;font-weight:900}
.widget-vote-sub{font-family:monospace;font-size:7px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink3)}
.widget-divider-v{width:1px;background:var(--rule);align-self:stretch}

.widget-nuance{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--rule)}
.widget-nuance-btn{padding:8px;cursor:pointer;background:transparent;border:none;font-family:monospace;font-size:7px;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink3);transition:background 0.15s}
.widget-nuance-btn:hover{background:var(--surface)}

.widget-result{padding:16px;display:none;flex-direction:column;gap:12px}
.widget-result.show{display:flex}
.result-hed{font-family:Georgia,serif;font-size:15px;font-weight:700;color:var(--ink)}
.result-sub{font-family:monospace;font-size:8px;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink3)}
.result-bar{height:10px;display:flex;border-radius:3px;overflow:hidden;margin:4px 0}
.result-stats{display:flex;justify-content:space-between;font-family:monospace;font-size:9px}
.result-reason{border-left:3px solid var(--cond);padding:8px 10px;background:var(--surface);font-family:Georgia,serif;font-size:12px;font-style:italic;color:var(--ink);line-height:1.5}

.widget-footer{padding:8px 14px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--rule)}
.widget-count{font-family:monospace;font-size:8px;color:var(--ink3)}
.widget-cta{font-family:monospace;font-size:8px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink);text-decoration:none;border:1px solid var(--ink);padding:4px 10px;transition:background 0.15s}
.widget-cta:hover{background:var(--ink);color:var(--paper)}

.widget-loading{padding:32px;text-align:center;font-family:Georgia,serif;font-size:14px;font-style:italic;color:var(--ink3)}
.widget-error{padding:16px;text-align:center;font-family:monospace;font-size:8px;color:var(--ink3)}

/* Multi-question carousel */
.widget-nav{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px;border-top:1px solid var(--rule)}
.widget-dot{width:6px;height:6px;border-radius:50%;background:var(--rule);cursor:pointer;transition:background 0.2s}
.widget-dot.active{background:var(--ink)}

[data-theme="dark"]{--ink:#f0ece4;--paper:#1a1714;--surface:#252118;--rule:#3a3530;--ink3:#8a837a;--ink4:#6a635a}
</style>
</head>
<body>
<div class="widget" id="widget">
  <div class="widget-loading" id="loading">Loading Purple Pulse...</div>
</div>

<script>
const SURL='https://snwvxdbgbvloubyphmtw.supabase.co';
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNud3Z4ZGJnYnZsb3VieXBobXR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3NjQ3NjQsImV4cCI6MjA5MzM0MDc2NH0.Wi6_jXt6Q3QLC9EOuQB_bsqmAEDLjM3358KEoXFkZXQ';

// Get config from URL params
const params=new URLSearchParams(window.location.search);
const TOPIC=params.get('topic')||'';
const COUNT=Math.min(parseInt(params.get('count')||'3'),5);
const PUBLISHER=params.get('publisher')||document.referrer||'direct';
const DARK=params.get('dark')==='1';
const LANG=params.get('lang')||'en';

if(DARK)document.documentElement.setAttribute('data-theme','dark');

let questions=[];
let curQ=0;
let voted={};// topicId -> option
let allReasons=[];

async function sb(path,opts={}){
  const res=await fetch(SURL+'/rest/v1/'+path,{
    headers:{
      'apikey':SKEY,
      'Authorization':'Bearer '+SKEY,
      'Content-Type':'application/json',
      ...opts.headers
    },
    ...opts
  });
  if(!res.ok)throw new Error('Supabase '+res.status);
  return res.json();
}

async function init(){
  try{
    // Load voted from localStorage
    try{const v=JSON.parse(localStorage.getItem('pw_votes')||'{}');voted=v;}catch(e){}

    // Build query - get most divisive questions for this topic/tag
    let query='topics?select=*&status=eq.live&order=created_at.desc&limit=20';
    if(TOPIC)query+='&tags=cs.{'+encodeURIComponent(TOPIC)+'}';

    const topics=await sb(query);

    // Score by divisiveness (closest to 50/50)
    const scored=topics
      .filter(t=>tv(t)>=2)
      .map(t=>{
        const tot=tv(t);
        const yesPct=Math.round(((t.votes_yes||0)/tot)*100);
        const gap=Math.abs(yesPct-50);
        const confidence=Math.min(1,tot/15);
        return{...t,_score:(100-gap)*confidence};
      })
      .sort((a,b)=>b._score-a._score)
      .filter(t=>!voted[t.id])
      .slice(0,COUNT);

    if(!scored.length){
      // Fallback: newest questions even without votes
      const fallback=topics.filter(t=>!voted[t.id]).slice(0,COUNT);
      if(!fallback.length){
        document.getElementById('loading').textContent='You\'ve voted on all current questions. Check back tomorrow!';
        return;
      }
      questions=fallback;
    }else{
      questions=scored;
    }

    // Load reasons for context
    const ids=questions.map(t=>t.id);
    try{
      const reasons=await sb('reasons?select=*&hidden=eq.false&order=likes.desc&limit=50');
      allReasons=reasons.filter(r=>ids.includes(r.topic_id));
    }catch(e){}

    renderWidget();
  }catch(e){
    document.getElementById('widget').innerHTML='<div class="widget-error">Purple Pulse unavailable. <a href="https://purple-poll.com" target="_blank">Visit purple-poll.com →</a></div>';
  }
}

function tv(t){return(t.votes_yes||0)+(t.votes_no||0)+(t.votes_conditional||0)+(t.votes_unsure||0);}

function renderWidget(){
  const w=document.getElementById('widget');
  const t=questions[curQ];
  if(!t)return;

  const tot=tv(t);
  const yesPct=tot>0?Math.round(((t.votes_yes||0)/tot)*100):50;
  const noPct=tot>0?Math.round(((t.votes_no||0)/tot)*100):50;
  const topReason=allReasons.filter(r=>r.topic_id===t.id).sort((a,b)=>(b.likes||0)-(a.likes||0))[0];
  const tag=(t.tags||['General'])[0];
  const hasVoted=voted[t.id];

  // Determine colors based on alignment
  const isFlipped=t.yes_alignment==='right';
  const yesColor=isFlipped?'var(--no)':'var(--yes)';
  const noColor=isFlipped?'var(--yes)':'var(--no)';

  // Dots for multi-question
  const dots=questions.length>1?'<div class="widget-nav">'+
    questions.map((_,i)=>'<div class="widget-dot'+(i===curQ?' active':'')+'" onclick="goToQ('+i+')"></div>').join('')+
  '</div>':'';

  w.innerHTML=
    // Header
    '<div class="widget-head">'+
      '<div class="widget-brand">'+
        '<div class="widget-brand-logo">Purple</div>'+
        '<div class="widget-brand-tag">Live Poll</div>'+
      '</div>'+
      '<div class="widget-pulse"><span class="pulse-dot"></span>'+tot+' votes</div>'+
    '</div>'+

    // Question
    '<div class="widget-q">'+
      '<div class="widget-tag">'+esc(tag)+(t.is_hot?' &nbsp;·&nbsp; 🔥 Hot':'')+' &nbsp;·&nbsp; '+tot+' votes</div>'+
      esc(t.question)+
    '</div>'+

    // Both sides (dark panel)
    '<div class="widget-sides" onclick="openPurple(\''+t.id+'\')" style="cursor:pointer">'+
      '<div class="widget-side">'+
        '<div class="widget-side-lbl" style="color:'+yesColor+'">← Left argues</div>'+
        '<div class="widget-side-txt" id="wl-'+t.id+'">Tap to read both sides →</div>'+
      '</div>'+
      '<div class="widget-side-divider"></div>'+
      '<div class="widget-side">'+
        '<div class="widget-side-lbl" style="color:'+noColor+'">Right argues →</div>'+
        '<div class="widget-side-txt" id="wr-'+t.id+'">Read before you vote →</div>'+
      '</div>'+
    '</div>'+

    // Vote buttons (hidden if already voted)
    (hasVoted?'':
      '<div class="widget-votes">'+
        '<button class="widget-vote-btn" onclick="castVote(\''+t.id+'\',\'yes\')">'+
          '<span class="widget-vote-lbl" style="color:'+yesColor+'">Yes</span>'+
          '<span class="widget-vote-sub">I agree</span>'+
        '</button>'+
        '<div class="widget-divider-v"></div>'+
        '<button class="widget-vote-btn" onclick="castVote(\''+t.id+'\',\'no\')">'+
          '<span class="widget-vote-lbl" style="color:'+noColor+'">No</span>'+
          '<span class="widget-vote-sub">I disagree</span>'+
        '</button>'+
      '</div>'+
      '<div class="widget-nuance">'+
        '<button class="widget-nuance-btn" onclick="castVote(\''+t.id+'\',\'conditional\')">~ Yes, but with conditions</button>'+
        '<button class="widget-nuance-btn" onclick="castVote(\''+t.id+'\',\'unsure\')">? Not sure yet</button>'+
      '</div>'
    )+

    // Result (shown after voting or if already voted)
    '<div class="widget-result'+(hasVoted?' show':'')+'" id="wr-result-'+t.id+'">'+
      '<div class="result-hed">'+
        (hasVoted?'You voted <span style="color:'+(hasVoted==='yes'?yesColor:noColor)+'">'+hasVoted+'</span> — here\'s where America stands:':'Here\'s where America stands')+
      '</div>'+
      '<div class="result-bar">'+
        '<div style="width:'+yesPct+'%;background:'+yesColor+'"></div>'+
        '<div style="width:'+noPct+'%;background:'+noColor+'"></div>'+
      '</div>'+
      '<div class="result-stats">'+
        '<span style="color:'+yesColor+'">Yes '+yesPct+'%</span>'+
        '<span style="color:var(--ink3)">'+tot+' votes</span>'+
        '<span style="color:'+noColor+'">No '+noPct+'%</span>'+
      '</div>'+
      (topReason?'<div class="result-reason">&ldquo;'+esc(topReason.text.slice(0,100))+(topReason.text.length>100?'&hellip;':'')+'&rdquo;<br><span style="font-family:monospace;font-size:9px;color:var(--ink4)">— '+esc(topReason.name||'Anonymous')+'</span></div>':'')+
    '</div>'+

    // Footer
    '<div class="widget-footer">'+
      '<span class="widget-count">'+questions.length+' question'+(questions.length!==1?'s':'')+' · Purple Pulse</span>'+
      '<a class="widget-cta" href="https://purple-poll.com?ref='+encodeURIComponent(PUBLISHER)+'" target="_blank">More on Purple →</a>'+
    '</div>'+
    dots;

  // Load party positions asynchronously
  loadSides(t);
}

function esc(s){
  if(!s)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function loadSides(t){
  if(t._sidesLoaded)return;
  t._sidesLoaded=true;
  try{
    const res=await fetch(SURL+'/functions/v1/party-positions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+SKEY},
      body:JSON.stringify({question:t.question,topic_id:t.id})
    });
    if(!res.ok)return;
    const data=await res.json();
    if(data.positions){
      const lEl=document.getElementById('wl-'+t.id);
      const rEl=document.getElementById('wr-'+t.id);
      if(lEl&&data.positions.left)lEl.textContent=data.positions.left.split('.')[0]+'.';
      if(rEl&&data.positions.right)rEl.textContent=data.positions.right.split('.')[0]+'.';
      if(data.positions.yes_alignment)t.yes_alignment=data.positions.yes_alignment;
    }
  }catch(e){}
}

async function castVote(topicId,option){
  // Rate limit: one vote per topic per session
  if(voted[topicId])return;

  // Save locally immediately
  voted[topicId]=option;
  try{localStorage.setItem('pw_votes',JSON.stringify(voted));}catch(e){}

  // Show result optimistically
  const t=questions.find(x=>x.id===topicId);
  if(t){
    t['votes_'+option]=(t['votes_'+option]||0)+1;
  }
  renderWidget();

  // Save to Supabase (anonymous vote with publisher attribution)
  try{
    // Update topic vote count
    await fetch(SURL+'/rest/v1/rpc/increment_vote',{
      method:'POST',
      headers:{'apikey':SKEY,'Authorization':'Bearer '+SKEY,'Content-Type':'application/json'},
      body:JSON.stringify({topic_id:topicId,vote_col:'votes_'+option,publisher_ref:PUBLISHER})
    });
  }catch(e){
    // Fallback: direct update
    try{
      const t2=questions.find(x=>x.id===topicId);
      if(t2){
        await fetch(SURL+'/rest/v1/topics?id=eq.'+topicId,{
          method:'PATCH',
          headers:{'apikey':SKEY,'Authorization':'Bearer '+SKEY,'Content-Type':'application/json','Prefer':'return=minimal'},
          body:JSON.stringify({['votes_'+option]:(t2['votes_'+option]||0)})
        });
      }
    }catch(e2){}
  }

  // Track widget vote for publisher analytics
  try{
    await fetch(SURL+'/rest/v1/widget_votes',{
      method:'POST',
      headers:{'apikey':SKEY,'Authorization':'Bearer '+SKEY,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify({
        topic_id:topicId,
        vote_option:option,
        publisher:PUBLISHER,
        referrer:document.referrer,
        voted_at:new Date().toISOString()
      })
    });
  }catch(e){}

  // Auto-advance to next question after 2.5s
  if(curQ<questions.length-1){
    setTimeout(()=>{curQ++;renderWidget();sendHeight();},2500);
  } else {
    setTimeout(sendHeight, 100);
  }
}

function goToQ(idx){curQ=idx;renderWidget();}

function sendHeight(){
  // Tell parent iframe how tall we are
  const h=document.body.scrollHeight||document.documentElement.scrollHeight;
  if(window.parent!==window){
    window.parent.postMessage({type:'purple-resize',height:h},'*');
  }
}

function openPurple(topicId){
  window.open('https://purple-poll.com?topic='+topicId+'&ref='+encodeURIComponent(PUBLISHER),'_blank');
}

init();
// Send height after content loads
window.addEventListener('load', function(){ setTimeout(sendHeight, 300); });
</script>
</body>
</html>
